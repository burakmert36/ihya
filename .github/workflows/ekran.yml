name: Simülatör ekran görüntüleri

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "Tasarim/**", ".claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ekran
  cancel-in-progress: true

jobs:
  ekran:
    runs-on: ${{ vars.TEST_RUNNER || 'macos-15-intel' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: En yeni Xcode'u seç
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          mkdir -p logs shots
          { xcodebuild -version; sw_vers; } | tee logs/env.txt

      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: iPhone 17 simülatörü
        run: |
          python3 scripts/sim_sec.py > sim.txt
          read UDID NAME < sim.txt
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "Simülatör: $NAME $UDID" | tee -a logs/env.txt
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "09:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl privacy "$UDID" grant location com.burakmert36.ihya || true

      - name: Simülatör için derle
        run: |
          set -o pipefail
          xcodebuild build \
            -project Ihya.xcodeproj -scheme Ihya -configuration Debug \
            -destination "id=$UDID" -derivedDataPath dd \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM="" \
            2>&1 | tee logs/build.log | grep -E "error:|\*\* BUILD" | head -300

      - name: Ekranları çek
        continue-on-error: true
        run: |
          xcrun simctl install "$UDID" dd/Build/Products/Debug-iphonesimulator/Ihya.app
          bash scripts/ekranlar.sh "$UDID" shots 2>&1 | tee logs/ekran.log

      - name: Sonuçları kaydet
        if: always()
        run: |
          mkdir -p /tmp/out/shots
          cp shots/*.png /tmp/out/shots/ 2>/dev/null || true
          cp logs/*.txt logs/ekran.log /tmp/out/ 2>/dev/null || true
          [ -f logs/build.log ] && { grep -E "error:|\*\* BUILD" logs/build.log | sort -u | head -300; echo "-----"; tail -60 logs/build.log; } > /tmp/out/build-key.txt
          cp ~/Library/Logs/DiagnosticReports/Ihya* /tmp/out/ 2>/dev/null || true
          echo "run=${{ github.run_number }} sha=${{ github.sha }} status=${{ job.status }}" > /tmp/out/durum.txt
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git fetch origin test-logs || true
          git checkout -B test-logs
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/out/* .
          git add -A
          git commit -qm "ekran ${{ github.run_number }} (${{ github.sha }})" || true
          git push -f origin test-logs || true
