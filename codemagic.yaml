# Codemagic (codemagic.io) ile yedek derleme: GitHub'ın Mac makineleri iş almadığında imzasız IPA üretir.
# Derleme bitince "Artifacts" altında Ihya.ipa çıkar; telefonda indirip SideStore ile açılır.
workflows:
  ihya-ipa:
    name: Ihya IPA (imzasız, SideStore için)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: XcodeGen
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Derle
        script: |
          set -o pipefail
          V="$(tr -d '[:space:]' < VERSION).$BUILD_NUMBER"
          echo "Sürüm $V"
          xcodebuild -project Ihya.xcodeproj -scheme Ihya -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$V" CURRENT_PROJECT_VERSION="$((BUILD_NUMBER + 100))" \
            build 2>&1 | tee build.log | grep -E "error:|\*\* BUILD" | head -100
      - name: IPA paketle
        script: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/Ihya.app out/Payload/
          (cd out && zip -qry Ihya.ipa Payload)
          ls -la out/Ihya.ipa
    artifacts:
      - out/Ihya.ipa
      - build.log
