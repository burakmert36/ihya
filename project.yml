name: Ihya
options:
  bundleIdPrefix: com.burakmert36
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: tr

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: "NO"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "NO"

targets:
  Ihya:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Paylasilan
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: IhyaWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.burakmert36.ihya
        PRODUCT_NAME: Ihya
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/Ihya.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ihya
        CFBundleName: Ihya
        CFBundleDevelopmentRegion: tr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UIBackgroundModes: [audio, fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.burakmert36.ihya.vakit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts: [Amiri-Regular.ttf, Amiri-Bold.ttf]
        NSLocationWhenInUseUsageDescription: Kıble yönünü ve istersen namaz vakitlerini bulunduğun yere göre hesaplamak için kullanılır. Konumun telefondan çıkmaz.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            LSItemContentTypes: [com.adobe.pdf]
            LSHandlerRank: Alternate
        CFBundleURLTypes:
          - CFBundleURLName: com.burakmert36.ihya
            CFBundleURLSchemes: [ihya]
    scheme:
      testTargets: [IhyaTests]

  IhyaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Paylasilan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.burakmert36.ihya.widgets
        PRODUCT_NAME: IhyaWidgets
        CODE_SIGN_ENTITLEMENTS: Widgets/IhyaWidgets.entitlements
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Ihya
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  IhyaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Ihya
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.burakmert36.ihya.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ihya.app/Ihya"
        BUNDLE_LOADER: "$(TEST_HOST)"
